<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 2026 | Knockout Stage</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="knockout.css">
</head>

<body>

<header class="header">
    <h1>🏆 FIFA World Cup 2026</h1>

    <a href="groups.html" class="back-btn">
        ← Back to Groups
    </a>
</header>

<main class="bracket">

    <section class="bracket-side bracket-left">

        <div class="round round-32">
            <h2>Round of 32</h2>
            <div id="round32-left" class="matches"></div>
        </div>

        <div class="round round-16">
            <h2>Round of 16</h2>
            <div id="round16-left" class="matches"></div>
        </div>

        <div class="round quarter-round">
            <h2>Quarter Finals</h2>
            <div id="quarter-left" class="matches"></div>
        </div>

        <div class="round semi-round">
            <h2>Semi Final</h2>
            <div id="semi-left" class="matches"></div>
        </div>

    </section>

    <section class="center-stage">

        <div class="round final-round">
            <h2>Final</h2>
            <div id="final" class="matches"></div>
        </div>

        <div class="champion-section">
            <h2>Champion</h2>

            <div id="champion" class="champion">
                🏆
            </div>
        </div>

    </section>

    <section class="bracket-side bracket-right">

        <div class="round semi-round">
            <h2>Semi Final</h2>
            <div id="semi-right" class="matches"></div>
        </div>

        <div class="round quarter-round">
            <h2>Quarter Finals</h2>
            <div id="quarter-right" class="matches"></div>
        </div>

        <div class="round round-16">
            <h2>Round of 16</h2>
            <div id="round16-right" class="matches"></div>
        </div>

        <div class="round round-32">
            <h2>Round of 32</h2>
            <div id="round32-right" class="matches"></div>
        </div>

    </section>

</main>

<script src="knockout.js"></script>

</body>
</html>
